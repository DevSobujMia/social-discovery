steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/project-032ba178-497a-4f65-950/cityhost-repo/cityhost-app:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/project-032ba178-497a-4f65-950/cityhost-repo/cityhost-app:latest'
      - '.'

images:
  - 'asia-south1-docker.pkg.dev/project-032ba178-497a-4f65-950/cityhost-repo/cityhost-app:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/project-032ba178-497a-4f65-950/cityhost-repo/cityhost-app:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
